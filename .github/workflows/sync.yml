name: Sincronizar imagens Swift
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem gravar imagens ou alterar Firebase'
        type: boolean
        default: true
      limit:
        description: 'Quantidade de alimentos (0 = todos)'
        default: '0'
        type: string
      missing_only:
        description: 'Priorizar execução somente dos produtos do jogo sem foto'
        type: boolean
        default: false
      deduplicate:
        description: 'Consolidar duplicados com cópia recuperável no Firebase'
        type: boolean
        default: true
      prune_unmatched:
        description: 'Remover do catálogo produtos não encontrados após consulta completa (guardar cópia)'
        type: boolean
        default: true
      product_code:
        description: 'Opcional: código Swift para execução de um alimento'
        default: ''
        type: string
      source_page:
        description: 'Opcional: página oficial /p desse alimento (usar com código)'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: swift-image-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: reports/swift-public-catalog.json
          key: ${{ runner.os }}-swift-public-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-swift-public-v3-
      - name: Sincronizar catálogo
        env:
          PYTHONPATH: src
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          IMAGE_SYNC_TOKEN: ${{ secrets.IMAGE_SYNC_TOKEN }}
          IMAGE_SERVICE_URL: ${{ vars.IMAGE_SERVICE_URL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          PRODUCT_LIMIT: ${{ inputs.limit || '0' }}
          PRODUCT_CODE: ${{ inputs.product_code || '' }}
          SOURCE_PAGE: ${{ inputs.source_page || '' }}
          MISSING_ONLY: ${{ inputs.missing_only || false }}
          DEDUPLICATE: ${{ github.event_name == 'schedule' || inputs.deduplicate }}
          PRUNE_UNMATCHED: ${{ github.event_name == 'schedule' || inputs.prune_unmatched }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$MISSING_ONLY" = "true" ]; then args+=(--missing-only); fi
          if [ "$DEDUPLICATE" = "true" ]; then args+=(--deduplicate); fi
          if [ "$PRUNE_UNMATCHED" = "true" ]; then args+=(--prune-unmatched); fi
          if [ -n "$PRODUCT_CODE" ] || [ -n "$SOURCE_PAGE" ]; then args+=(--product-code "$PRODUCT_CODE" --source-page "$SOURCE_PAGE"); fi
          python -m swift_images.sync --limit "$PRODUCT_LIMIT" "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && hashFiles('reports/swift-public-catalog.json') != ''
        with:
          path: reports/swift-public-catalog.json
          key: ${{ runner.os }}-swift-public-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumo-sincronizacao
          path: |
            reports/latest.json
            reports/unmatched.json
          if-no-files-found: ignore
          retention-days: 14
